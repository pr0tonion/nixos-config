name: Update flake.lock

# Weekly PR bumping all flake inputs (nixos-26.05, home-manager, unstable,
# plasma-manager). CI is dispatched on the PR branch and the PR auto-merges once
# the required checks pass; home-server then picks it up via system.autoUpgrade.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch ci.yml on the PR branch

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/update-flake-lock@v29
        id: update
        with:
          pr-title: "Update flake.lock"
          pr-labels: dependencies

      # PRs created with GITHUB_TOKEN don't trigger pull_request workflows, so run CI
      # explicitly. Branch protection on main holds the merge until it passes.
      - name: Run CI and enable auto-merge
        if: steps.update.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.update.outputs.pull-request-number }}
        run: |
          gh workflow run ci.yml --ref update_flake_lock_action -f pr="$PR"
          gh pr merge "$PR" --auto --merge
