name: Update flake.lock

# Weekly PR bumping all flake inputs (nixos-26.05, home-manager, unstable,
# plasma-manager). Once merged to main, home-server picks it up through
# system.autoUpgrade.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/update-flake-lock@main
        with:
          pr-title: "Update flake.lock"
          pr-labels: dependencies
          # PRs opened with the default GITHUB_TOKEN don't trigger the CI workflow.
          # Add a fine-grained PAT (contents + pull-requests: write) as the
          # FLAKE_LOCK_TOKEN secret so CI runs on these PRs.
          token: ${{ secrets.FLAKE_LOCK_TOKEN || github.token }}
